  #     - app-network
  #   depends_on:
  #     - app

  servidor-web-prueba:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prueba
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html
      - ./apache.conf:/etc/apache2/sites-available/000-default.conf
    environment:
      MYSQL_HOST: samantha-db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
