server {
    # 1. Escuchar en el puerto 80 (dentro del contenedor)
    listen 80;
    server_name localhost;

    # 2. Raíz del proyecto (debe coincidir con tus 'volumes')
    root /var/www/html;

    # 3. Archivo principal
    index index.php;

    # 4. Configuración de logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # 5. Regla para peticiones a la raíz (ej: localhost:8081/)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 6. Esta es la parte MÁS IMPORTANTE
    # Pasa todos los scripts .php al servicio 'app' en el puerto 9000
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # 'app' es el nombre de tu servicio de PHP en docker-compose.yml
        fastcgi_pass app:9000; 

        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # 7. Denegar acceso a archivos .htaccess
    location ~ /\.ht {
        deny all;
    }
}
